# PlanningExpert — kendi sunucumuzda (Hetzner CX33, Karabasan botuyla aynı makine).
# deploy/README.md. Tek compose projesi: "planningexpert" (/opt/planningexpert/deploy).
#
#   ts        Tailscale cihazı "planningexpert": Funnel ile HTTPS, internete kapı açmadan
#             https://planningexpert.<tailnet>.ts.net       → web (site)
#             https://planningexpert.<tailnet>.ts.net:8443  → backend (Convex API)
#   backend   Convex (self-hosted), veritabanı SQLite (volume: convex-data)
#   web       Site: TanStack Start / Nitro Node sunucusu (/opt/planningexpert/.output)
#   dashboard Convex paneli — yalnızca gerektiğinde: `docker compose --profile tools up -d dashboard`
#
# Kurallar:
# - Karabasan botunun kapsayıcılarına, ağına ve kapılarına dokunulmaz; burada yalnızca
#   bu projenin servisleri var. Host'a yalnızca 127.0.0.1 kapıları (Convex CLI için).
# - Her serviste bellek sınırı: botların belleği korunur.
# - Veri volume'larda: `docker compose down -v` ASLA (veriyi siler).
# - Değerler deploy/.env'de (örnek: deploy/.env.example; .env git'e girmez).

name: planningexpert

services:
  ts:
    image: tailscale/tailscale:${TAILSCALE_TAG:-stable}
    hostname: planningexpert
    restart: unless-stopped
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: 'true'
      # Boşsa ilk açılışta günlükte giriş bağlantısı çıkar (docker compose logs ts).
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale:/config:ro
    mem_limit: 128m

  backend:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_TAG:?pin CONVEX_BACKEND_TAG in .env}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - '127.0.0.1:3210:3210'
    volumes:
      - convex-data:/convex/data
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-planningexpert}
      INSTANCE_SECRET: ${INSTANCE_SECRET:?set INSTANCE_SECRET in .env (openssl rand -hex 32)}
      # Dışarıdan görünen adres (Funnel, 8443).
      CONVEX_CLOUD_ORIGIN: ${CONVEX_PUBLIC_URL:?e.g. https://planningexpert.tailXXXX.ts.net:8443}
      CONVEX_SITE_ORIGIN: http://backend:3211
      DISABLE_BEACON: '1'
      REDACT_LOGS_TO_CLIENT: '1'
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 10s
      start_period: 20s
    mem_limit: ${BACKEND_MEM:-1200m}

  web:
    image: node:22-slim
    restart: unless-stopped
    working_dir: /app
    command: ['node', '.output/server/index.mjs']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3000'
    volumes:
      - ..:/app:ro
    ports:
      - '127.0.0.1:3000:3000'
    mem_limit: 384m

  # SOP işleyicisi (docs/wiki/12-sop-olusturma.md): sıradaki SOP videosunu Gemini'ye
  # gösterir, kareleri ffmpeg ile çıkarır. Aynı anda tek iş, düşük öncelik (nice),
  # tek çekirdek; videolar `sop-data` volume'ünde saklanır (gece yedeğine girmez).
  # deploy.sh kurar; gizli değer gerekmez (jeton kendiliğinden, Gemini anahtarı sayfadan).
  sop-worker:
    build:
      context: .
      dockerfile: sop-worker.Dockerfile
    restart: unless-stopped
    working_dir: /app
    environment:
      SOP_CONVEX_SITE: http://backend:3211
      SOP_CONVEX_URL: http://backend:3210
      SOP_WORKER_TOKEN: ${SOP_WORKER_TOKEN:-}
      SOP_AI_KEY: ${SOP_AI_KEY:-}
      SOP_AI_MODEL: ${SOP_AI_MODEL:-gemini-flash-latest}
      SOP_DATA_DIR: /data
    volumes:
      - ..:/app:ro
      - sop-data:/data
    depends_on:
      - backend
    mem_limit: 384m
    cpus: 1.0

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_DASHBOARD_TAG:-latest}
    profiles: ['tools']
    ports:
      - '127.0.0.1:6791:6791'
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_PUBLIC_URL}
    mem_limit: 256m

volumes:
  ts-state:
  convex-data:
  sop-data:
