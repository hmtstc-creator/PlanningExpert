# Kendi sunucumuzda Convex (self-hosted) — backend, dashboard ve Postgres.
# deploy/README.md → Aşama 2. Kaynak: Convex'in resmi self-hosted compose
# dosyası (github.com/get-convex/convex-backend → self-hosted/docker); kurulum
# günü onunla karşılaştırılır, imaj sürümleri .env'de sabitlenir (latest değil).
#
# Kurallar:
# - Portlar yalnızca 127.0.0.1'de: dışarıya Caddy (HTTPS) açar, dashboard yalnızca
#   SSH tüneliyle (ssh -L 6791:127.0.0.1:6791 …).
# - Veri iki adlandırılmış volume'da: pgdata (veritabanı) ve convex-data
#   (dosya deposu: fotoğraflar). `docker compose down -v` ASLA çalıştırılmaz
#   (volume'ları siler).
# - Değerler deploy/convex/.env'de (örnek: .env.example; .env git'e girmez).

name: portal-convex

services:
  postgres:
    image: postgres:${POSTGRES_TAG:-17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: convex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Convex veritabanı adını INSTANCE_NAME'den türetir (- yerine _).
      POSTGRES_DB: ${POSTGRES_DB:-convex_self_hosted}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U convex']
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/get-convex/convex-backend:${CONVEX_BACKEND_TAG:?pin CONVEX_BACKEND_TAG in .env}
    restart: unless-stopped
    stop_grace_period: 10s
    stop_signal: SIGINT
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3210:3210'
      - '127.0.0.1:3211:3211'
    volumes:
      - convex-data:/convex/data
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME:-convex-self-hosted}
      INSTANCE_SECRET: ${INSTANCE_SECRET:?set INSTANCE_SECRET in .env (openssl rand -hex 32)}
      # Dışarıdan görünen adresler (Caddy, HTTPS).
      CONVEX_CLOUD_ORIGIN: ${CONVEX_CLOUD_ORIGIN:?e.g. https://api.portal.example.com}
      CONVEX_SITE_ORIGIN: ${CONVEX_SITE_ORIGIN:-http://127.0.0.1:3211}
      POSTGRES_URL: postgresql://convex:${POSTGRES_PASSWORD}@postgres:5432
      # Postgres aynı makinede, iç ağda: SSL gerekmez.
      DO_NOT_REQUIRE_SSL: '1'
      DISABLE_BEACON: '1'
      REDACT_LOGS_TO_CLIENT: '1'
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:${CONVEX_DASHBOARD_TAG:?pin CONVEX_DASHBOARD_TAG in .env}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '127.0.0.1:6791:6791'
    environment:
      NEXT_PUBLIC_DEPLOYMENT_URL: ${CONVEX_CLOUD_ORIGIN}

volumes:
  pgdata:
  convex-data:
