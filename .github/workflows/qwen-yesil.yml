# Ücretsiz modelle "verify yeşile dönene kadar" düzeltme turu.
#
# Amaç token tasarrufu: mekanik hataların (tip, kırık test, bozuk import)
# düzeltme döngüsü Claude'un bağlamında değil, burada ücretsiz bir modelde
# döner. Claude'a yalnız qwen-rapor.md gelir.
#
# Nasıl çalıştırılır (telefondan):
#   - Açık bir PR'a "qwen" etiketini ekle, ya da
#   - Actions → "Qwen: verify yeşile çevir" → Run workflow → dal adını yaz.
#
# main'de ÇALIŞMAZ. Korunan dosyalara (motor, doğrulayıcı, OEE, şema,
# Planning Logic) dokunulduysa hiçbir şey itilmez; ayrıntı scripts/qwen-yesil.sh.
name: "Qwen: verify yeşile çevir"

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      dal:
        description: "Düzeltilecek dal (main olamaz)"
        required: true
        type: string
      gorev:
        description: "Görev modu: Claude'un yazdığı kodlama görevi (boşsa yalnız verify düzeltme)"
        required: false
        type: string

concurrency:
  group: qwen-${{ github.event.pull_request.number || inputs.dal }}
  cancel-in-progress: true

jobs:
  duzelt:
    # Etiketle tetiklendiyse yalnız "qwen" etiketinde çalışır.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'qwen'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || inputs.dal }}
          fetch-depth: 0

      - name: main korumalı
        run: |
          DAL="$(git rev-parse --abbrev-ref HEAD)"
          if [ "$DAL" = "main" ]; then
            echo "main üzerinde çalışmaz. Kısa ömürlü bir dal kullan." >&2
            exit 1
          fi
          echo "Dal: $DAL"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Qwen Code kur
        run: npm install -g @qwen-code/qwen-code@latest

      - name: Verify yeşile çevir
        id: qwen
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.QWEN_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.QWEN_BASE_URL || 'https://openrouter.ai/api/v1' }}
          OPENAI_MODEL: ${{ vars.QWEN_MODEL || 'qwen/qwen3-coder:free' }}
          QWEN_TUR: "4"
          QWEN_GOREV: ${{ inputs.gorev }}
        run: bash scripts/qwen-yesil.sh

      - name: Raporu iş özetine yaz
        if: always()
        run: cat qwen-rapor.md >> "$GITHUB_STEP_SUMMARY" || true

      # Çalışma dalına DOKUNULMAZ. Düzeltmeler ayrı bir dala iter; oradan
      # çalışma dalına yalnız Claude okuyup karar vererek alır.
      - name: Düzeltmeleri ayrı dala it
        if: steps.qwen.outcome == 'success'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Değişiklik yok."
            exit 0
          fi
          DAL="$(git rev-parse --abbrev-ref HEAD)"
          git config user.name "qwen-bot"
          git config user.email "qwen-bot@users.noreply.github.com"
          git add -A
          git commit -m "Verify yeşile çevrildi (Qwen) — Claude onayı bekliyor"
          git push --force origin "HEAD:refs/heads/qwen/$DAL"
          echo "Düzeltmeler qwen/$DAL dalında. Çalışma dalı değişmedi."

      # Claude bulut oturumu Actions kayıtlarını okuyamaz; rapor her durumda
      # qwen-rapor/<dal> dalına yazılır, Claude oradan okur.
      - name: Raporu dala yaz
        if: always()
        run: |
          DAL="$(git rev-parse --abbrev-ref HEAD)"
          cp qwen-rapor.md /tmp/r.md 2>/dev/null || echo "Rapor oluşmadı (Qwen adımı başlamadan durdu)." > /tmp/r.md
          for f in .qwen-tur-*.txt; do [ -f "$f" ] && { echo; echo "## $f (son 30 satır)"; echo '```'; tail -30 "$f"; echo '```'; } >> /tmp/r.md; done
          git config user.name "qwen-bot"; git config user.email "qwen-bot@users.noreply.github.com"
          git checkout -q --orphan rapor-tmp && git rm -rfq . && cp /tmp/r.md qwen-rapor.md
          git add qwen-rapor.md && git commit -qm "Qwen raporu" && git push -fq origin "HEAD:refs/heads/qwen-rapor/$DAL"

      - name: Raporu PR'a yaz
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file qwen-rapor.md || true

      - name: Sonuç
        if: steps.qwen.outcome != 'success'
        run: |
          echo "Qwen verify'ı yeşile çeviremedi; hiçbir değişiklik itilmedi." >&2
          exit 1
