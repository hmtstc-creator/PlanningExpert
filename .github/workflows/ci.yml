# Her push ve PR'da: tip kontrolü, testler, build. Kırmızıysa main'e giden
# değişiklik bozuk demektir (Vercel ayrıca deploy eder; bu kapı uyarır).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
