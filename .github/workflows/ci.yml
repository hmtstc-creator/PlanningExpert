# Her push ve PR'da: tip kontrolü, testler, build. Kırmızıysa main'e giden
# değişiklik bozuk demektir. Yayın burada değil, VPS'te yalnızca yeşil commit'ten
# yapılır (deploy/README.md → Güncelleme).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Planlama mantığı değiştiyse Planning Logic sayfası da değişmeli.
      - name: Planning Logic is up to date
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-logic-docs.sh origin/${{ github.base_ref }}
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npx vitest run
      - name: Build
        run: npx vite build
      # Üretimde çalışan paketlerde kritik bilinen açık varsa dur. (xlsx'in
      # yüksek seviyeli bilinen açığı ayrı izleniyor: todolist.md 4.3.)
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=critical

